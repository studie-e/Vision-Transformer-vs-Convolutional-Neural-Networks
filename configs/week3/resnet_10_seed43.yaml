# Người phụ trách: Minh (cấu hình và lượt chạy ResNet), Hiền (manifest chia dữ liệu theo seed).
# Lặp thí nghiệm ResNet 10% dữ liệu với cặp seed chia dữ liệu 2027 và seed huấn luyện 43.
seed: 43
model:
  factory: src.models.resnet:build_model
  kwargs:
    width: 16
    blocks_per_stage: 3
    num_classes: 10
data:
  factory: src.data:build_loaders
  root: data
  download: false
  split_seed: 2027
  ratio: '0.10'
  batch_size: 128
  splits_dir: results/splits
training:
  epochs: 100
  optimizer: sgd
  lr: 0.05
  momentum: 0.9
  weight_decay: 0.0005
