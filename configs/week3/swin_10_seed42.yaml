# Người phụ trách: Minh (thử nghiệm Swin tuần 3).
seed: 42
model:
  factory: src.models.swin:build_model
  kwargs:
    patch_size:
    - 2
    - 2
    embed_dim: 26
    depths:
    - 2
    - 2
    - 2
    num_heads:
    - 2
    - 4
    - 8
    window_size:
    - 4
    - 4
    mlp_ratio: 2.0
    num_classes: 10
    dropout: 0.0
    attention_dropout: 0.0
    stochastic_depth_prob: 0.1
data:
  factory: src.data:build_loaders
  root: data
  download: false
  split_seed: 2026
  ratio: '0.10'
  batch_size: 128
  splits_dir: results/splits
training:
  epochs: 100
  optimizer: adamw
  lr: 0.0003
  weight_decay: 0.05
