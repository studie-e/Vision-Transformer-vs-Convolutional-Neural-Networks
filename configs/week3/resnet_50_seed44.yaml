# Người đóng góp: Minh (viết cấu hình và chạy lượt ResNet bổ sung).
# Phối hợp: Hiền cung cấp manifest chia dữ liệu theo seed.
# Lặp thí nghiệm ResNet 50% dữ liệu với cặp seed chia dữ liệu 2028 và seed huấn luyện 44.
seed: 44
model:
  factory: src.models.resnet:build_model
  kwargs:
    width: 16
    blocks_per_stage: 3
    num_classes: 10
data:
  factory: src.data:build_loaders
  root: data
  download: false
  split_seed: 2028
  ratio: '0.50'
  batch_size: 128
  splits_dir: results/splits
training:
  epochs: 100
  optimizer: sgd
  lr: 0.05
  momentum: 0.9
  weight_decay: 0.0005
