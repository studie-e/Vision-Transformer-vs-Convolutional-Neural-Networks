# Người đóng góp: Minh (viết cấu hình Swin cho thí nghiệm tuần 3).
# Phối hợp: Hiền cung cấp manifest dữ liệu dùng chung.
# Chạy thử nghiệm mở rộng Swin với 100% dữ liệu train, seed 44 và ngân sách 100 epoch.
seed: 44
model:
  factory: src.models.swin:build_model
  kwargs:
    patch_size:
    - 2
    - 2
    embed_dim: 26
    depths:
    - 2
    - 2
    - 2
    num_heads:
    - 2
    - 4
    - 8
    window_size:
    - 4
    - 4
    mlp_ratio: 2.0
    num_classes: 10
    dropout: 0.0
    attention_dropout: 0.0
    stochastic_depth_prob: 0.1
data:
  factory: src.data:build_loaders
  root: data
  download: false
  split_seed: 2028
  ratio: '1.00'
  batch_size: 128
  splits_dir: results/splits
training:
  epochs: 100
  optimizer: adamw
  lr: 0.0003
  weight_decay: 0.05
