# Người đóng góp: Minh (viết cấu hình khảo sát optimizer cho ResNet).
# Phối hợp: Hiền cung cấp manifest dữ liệu.
# Thử ResNet với SGD trong 10 epoch trên 50% dữ liệu train để so sánh cách thiết lập optimizer.
seed: 42
model:
  factory: src.models.resnet:build_model
  kwargs:
    width: 16
    blocks_per_stage: 3
    num_classes: 10
data:
  factory: src.data:build_loaders
  root: data
  download: false
  split_seed: 2026
  ratio: '0.50'
  batch_size: 128
  splits_dir: results/splits
training:
  epochs: 10
  optimizer: sgd
  lr: 0.05
  momentum: 0.9
  weight_decay: 0.0005
