# Người đóng góp: Hiền (viết YAML ResNet theo giao thức nhóm).
# Phối hợp: Minh phụ trách mô hình ResNet và vận hành lượt chạy.
# Chạy lượt chính ResNet tuần 2 trên 100% dữ liệu train, dùng seed 42 và huấn luyện 100 epoch.
seed: 42
model:
  factory: src.models.resnet:build_model
  kwargs:
    width: 16
    blocks_per_stage: 3
    num_classes: 10
data:
  factory: src.data:build_loaders
  root: data
  download: false
  split_seed: 2026
  ratio: '1.00'
  batch_size: 128
  splits_dir: results/splits
training:
  epochs: 100
  optimizer: sgd
  lr: 0.05
  momentum: 0.9
  weight_decay: 0.0005
