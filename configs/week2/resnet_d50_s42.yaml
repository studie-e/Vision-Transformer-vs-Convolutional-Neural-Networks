# Người phụ trách: Minh (cấu hình ResNet đã khóa sau tuning), Hiền (dữ liệu và manifest dùng chung).
# Lưu cấu hình ResNet 50% dữ liệu, seed 42, từ đợt khóa thông số trước khi nhóm chốt tên YAML hiện hành.
seed: 42
model:
  factory: src.models.resnet:build_model
  kwargs:
    width: 16
    blocks_per_stage: 3
    num_classes: 10
data:
  factory: src.data:build_loaders
  root: data
  download: false
  split_seed: 2026
  ratio: '0.50'
  batch_size: 128
  splits_dir: results/splits
training:
  epochs: 100
  optimizer: sgd
  lr: 0.05
  momentum: 0.9
  weight_decay: 0.0005
