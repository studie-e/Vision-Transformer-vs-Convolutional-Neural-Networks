seed: 42
model:
  factory: src.models.vit:build_model
  kwargs:
    image_size: 32
    patch_size: 4
    embed_dim: 96
    depth: 4
    num_heads: 4
    mlp_ratio: 1.5
    num_classes: 10
    dropout: 0.1
    use_pos_embed: true
data:
  factory: src.data:build_loaders
  root: data
  download: false
  split_seed: 2026
  ratio: '0.10'
  batch_size: 128
  splits_dir: results/splits
training:
  epochs: 100
  optimizer: adamw
  lr: 0.0003
  weight_decay: 0.05
