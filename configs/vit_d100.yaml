# Config ViT 100% dữ liệu — Tuần 2 (T10 Lan Anh)
# Seed đầu tiên: split_seed=2026, seed=42
seed: 42
model:
  factory: src.models.vit:build_model
  kwargs:
    image_size: 32
    patch_size: 4
    embed_dim: 96
    depth: 4
    num_heads: 4
    mlp_ratio: 1.5
    num_classes: 10
    dropout: 0.1
    use_pos_embed: true
data:
  factory: src.data:build_loaders
  root: data
  download: false
  split_seed: 2026
  ratio: '1.00'
  batch_size: 128
  splits_dir: results/splits
training:
  epochs: 5
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.01
