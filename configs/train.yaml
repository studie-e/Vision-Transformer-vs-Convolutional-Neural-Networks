# Full, standalone pilot config; not the locked week-2 comparison recipe.
seed: 17
model:
  factory: src.models.resnet:build_model
  kwargs:
    width: 16
    blocks_per_stage: 3
    num_classes: 10
data:
  factory: src.pilot_data:build_loaders
  source: fastai
  root: data
  download: true
  split_seed: 2026
  train_samples: 4500
  val_samples: 1000
  batch_size: 128
training:
  epochs: 3
  optimizer: sgd
  lr: 0.05
  momentum: 0.9
  weight_decay: 0.0005
